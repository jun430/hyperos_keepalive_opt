lmk_medium=960
lmk_critical=930
watermark_target=85
watermark_hysteresis=3
drop_level=1
game_mode=1
game_kill_cached=1
game_drop_caches=1
zram_takeover=0
swappiness=80
poll_normal=10
poll_game=3