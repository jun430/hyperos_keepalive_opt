# ============================================================
# 澎湃内存管理优化 - 默认配置模板
# 首次运行时复制为 /data/local/tmp/hkom/hkom.conf
# ============================================================
disable_mimd=1
disable_unfairmem=1
disable_mi_reclaim=1
disable_memory_standard=1
lmk_low=1001
lmk_medium=960
lmk_critical=930
watermark_target=85
watermark_hysteresis=3
drop_level=1
game_mode=1
game_kill_cached=1
game_drop_caches=1
zram_takeover=0
swappiness=60
poll_normal=10
poll_game=3
# 冻结与缓存上限（M11）
freezer_enable=1
max_cached_procs=64
reclaim_mb=64

watermark_scale_factor=100
bg_child_kill=5
